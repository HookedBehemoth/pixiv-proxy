name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy

  container-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [alpine, alpine-ugoira]

    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v4
    - name: Prepare image name
      id: prep
      run: |
        owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        echo "image=ghcr.io/${owner_lc}/reapixa" >> "$GITHUB_OUTPUT"

    - name: Login to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image (PR)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        target: ${{ matrix.target }}
        push: false
        outputs: type=cacheonly
        cache-from: type=gha,scope=reapixa-${{ matrix.target }}
        cache-to: type=gha,scope=reapixa-${{ matrix.target }},mode=max
        tags: ${{ steps.prep.outputs.image }}:${{ matrix.target }}

    - name: Build and push image (master)
      if: github.event_name == 'push'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        target: ${{ matrix.target }}
        push: true
        cache-from: type=gha,scope=reapixa-${{ matrix.target }}
        cache-to: type=gha,scope=reapixa-${{ matrix.target }},mode=max
        tags: |
          ${{ steps.prep.outputs.image }}:${{ matrix.target }}
          ${{ steps.prep.outputs.image }}:${{ matrix.target }}-${{ github.sha }}
